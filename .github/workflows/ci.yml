name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:cov
      - name: Upload coverage to Codecov
        # Dependabot PRs run with a restricted token and no access to repository
        # secrets, so CODECOV_TOKEN is empty and Codecov rejects the upload
        # ("Token required because branch is protected"). With fail_ci_if_error
        # that sinks the whole job. Skip the upload for Dependabot; coverage is
        # still uploaded on pushes to main and on regular (non-bot) PRs.
        if: matrix.node-version == 22 && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          fail_ci_if_error: true

  peer-compat:
    name: Lowest supported peers (Nest 10, Swagger 7, class-validator 0.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      # peerDependencies advertise support for majors older than the ones the
      # main matrix installs, so without this job that claim is never executed.
      # Pin every peer to its oldest supported version and run the suite.
      #
      # The pnpm.overrides block is dropped first: those are security pins for
      # THIS repo's dev tree (they force path-to-regexp >=8, which Express 4 —
      # what Nest 10 uses — cannot load). They are not published to consumers,
      # so applying them here would fail the job for a reason no user can hit.
      - name: Pin peers to the oldest supported versions
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete pkg.pnpm;
            Object.assign(pkg.devDependencies, {
              "@nestjs/common": "10.4.15",
              "@nestjs/core": "10.4.15",
              "@nestjs/platform-express": "10.4.15",
              "@nestjs/testing": "10.4.15",
              "@nestjs/swagger": "7.4.2",
              "class-validator": "0.14.1",
              "reflect-metadata": "0.1.14",
            });
            // platform-fastify is pinned to the Nest 10 line so its peer range
            // resolves; the Fastify adapter itself is exercised by the main
            // test matrix against current versions.
            pkg.devDependencies["@nestjs/platform-fastify"] = "10.4.15";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:unit
      - name: Express e2e
        run: npx vitest run test/e2e/express.e2e-spec.ts
      - name: Fastify e2e
        run: npx vitest run test/e2e/fastify.e2e-spec.ts

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            --call-analysis=false
            .
