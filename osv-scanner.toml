# Ignore dev dependency vulnerabilities — this library ships zero runtime deps.
# Dev deps only affect the local development workflow, not consumers.
[[PackageOverrides]]
group = "dev"
ignore = true

# basic-ftp 5.3.1: the fix exists only in the 6.x major, which the dependency
# chain cannot take yet. Remove once get-uri accepts basic-ftp ^6 (or
# release-it drops proxy-agent) and the lockfile resolves basic-ftp >=6.2.1.
[[IgnoredVulns]]
id = "GHSA-c475-qrg2-pj4r"
ignoreUntil = 2027-01-31
reason = "dev-only via release-it → proxy-agent → pac-proxy-agent → get-uri 8.0.1, which requires ^5.3.1; fix only in 6.x"
